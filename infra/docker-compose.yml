x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doors}
      POSTGRES_DB: ${POSTGRES_DB:-doors}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doors} -d ${POSTGRES_DB:-doors}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-doors}:${POSTGRES_PASSWORD:-doors}@postgres:5432/${POSTGRES_DB:-doors}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - api_uploads:/app/uploads
      - ../data:/app/data:ro
      - ../public/images:/app/static_images:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../public/images:/srv/static/images:ro
      - ../public/beutyDoor:/srv/static/beutyDoor:ro
      - ../public/icons:/srv/static/icons:ro
      - api_uploads:/var/www/uploads:ro
    depends_on:
      - api
      - web
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_uploads:
