# Production overlay. Local `docker compose -f infra/docker-compose.yml` is unchanged (port 80).
# Prod: docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --build
#
# Requires Docker Compose v2.24+ for ports !override.

services:
  postgres:
    mem_limit: 512m
    cpus: 1.0

  redis:
    mem_limit: 128m
    cpus: 0.5

  api:
    mem_limit: 512m
    cpus: 1.0
    environment:
      APP_ENV: production

  web:
    mem_limit: 512m
    cpus: 1.0

  nginx:
    mem_limit: 64m
    cpus: 0.25
    ports: !override
      - "127.0.0.1:8080:80"
